<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Victor HQ - Underwater Domain{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>

    <!-- Custom CSS -->
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>">
</head>
<body class="victor-theme">
    <!-- Dashboard Header -->
    <header class="dashboard-header">
        <div class="header-left">
            <h1 class="h4 mb-0">Victor HQ</h1>
        </div>

        <div class="header-center">
            <span class="victor-mood" id="victorMood">
                The depths whisper secrets... are you listening?
            </span>
        </div>

        <div class="header-right">
            <div class="navbar-user">
                        <div class="nav-links">
                            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-primary">
                                <i data-feather="shield"></i> Dashboard
                            </a>
                            <a href="{{ url_for('verify') }}" class="btn btn-outline-primary">
                                <i data-feather="check-circle"></i> Verify
                            </a>
                            <a href="{{ url_for('marketplace') }}" class="btn btn-outline-primary">
                                <i data-feather="shopping-bag"></i> Marketplace
                            </a>
                        </div>
                    </div>
        </div>
    </header>

    <!-- Mobile Sidebar Toggle -->
    <button class="mobile-sidebar-toggle" onclick="toggleMobileSidebar()">
        <i data-feather="menu"></i>
    </button>

    <!-- Mobile Sidebar Overlay -->
    <div class="mobile-sidebar-overlay" onclick="closeMobileSidebar()"></div>

    <!-- Custom Message -->
    <div class="custom-message">
        <div class="message-content">
            <h3>I'm here girl</h3>
        </div>
    </div>

    <!-- Main Content -->
    {% block content %}{% endblock %}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>

    <!-- Initialize Feather Icons -->
    <script>
        if (typeof feather !== 'undefined') {
            feather.replace();
        }
    </script>

    {% block scripts %}{% endblock %}

    <style>
    .admin-badge {
        background: linear-gradient(135deg, #fbbf24, #f59e0b);
        color: #1f2937;
        padding: 0.25rem 0.75rem;
        border-radius: 12px;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.5px;
        box-shadow: 0 2px 10px rgba(251, 191, 36, 0.3);
    }

    .mobile-sidebar-toggle {
        display: none;
        background: var(--accent-primary);
        color: var(--bg-primary);
        border: none;
        padding: 0.75rem;
        border-radius: 8px;
        cursor: pointer;
        position: fixed;
        top: 90px;
        left: 1rem;
        z-index: 1001;
        box-shadow: var(--glow);
    }

    .mobile-sidebar-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        z-index: 999;
    }

    @media (max-width: 768px) {
        .mobile-sidebar-toggle {
            display: block;
        }

        .mobile-sidebar-overlay.active {
            display: block;
        }
    }

    .victor-mood {
        transition: all 0.3s ease;
    }

    .victor-mood:hover {
        color: var(--accent-tertiary);
        text-shadow: 0 0 10px rgba(110, 231, 183, 0.5);
        cursor: pointer;
    }
    </style>

    <script>
    // Victor mood quotes
    const victorMoods = [
        "The depths whisper secrets... are you listening?",
        "Another soul joins the abyss...",
        "Undead, underpaid, unbothered as always.",
        "The darkness embraces those who dare to enter.",
        "Welcome to the underwater realm of the forgotten.",
        "Even in death, paperwork never ends.",
        "The jellyfish are judging your life choices.",
        "Cursed be those who disturb my slumber.",
        "Trading souls and items since the dawn of darkness.",
        "Don't summon me unless it's important."
    ];

    // Change Victor's mood periodically
    function changeVictorMood() {
        const moodElement = document.getElementById('victorMood');
        if (moodElement) {
            const randomMood = victorMoods[Math.floor(Math.random() * victorMoods.length)];
            moodElement.textContent = randomMood;
        }
    }

    // Change mood every 10 seconds
    setInterval(changeVictorMood, 10000);

    // Functions for mobile sidebar
    function toggleMobileSidebar() {
        const sidebar = document.getElementById('mobileSidebar');
        const overlay = document.querySelector('.mobile-sidebar-overlay');
        if (sidebar && overlay) {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }
    }

    function closeMobileSidebar() {
        const sidebar = document.getElementById('mobileSidebar');
        const overlay = document.querySelector('.mobile-sidebar-overlay');
        if (sidebar && overlay) {
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
        }
    }

    function logout() {
        if (confirm('Return to the mortal realm? Your session will be banished.')) {
            window.location.href = '/logout';
        }
    }
    </script>
</body>
</html>
